[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RES)sx24 -nolisten tcp
user=moon
priority=10
autorestart=true

[program:openbox]
command=/usr/bin/openbox-session
user=moon
environment=HOME="/home/moon",DISPLAY=":1"
priority=20
autorestart=true
startsecs=2

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -localhost -quiet
user=moon
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
user=moon
priority=40
autorestart=true

[program:agentd]
command=/usr/bin/python3 -m uvicorn agentd:app --app-dir /opt --host 0.0.0.0 --port 8000 --log-level warning
user=moon
environment=HOME="/home/moon",DISPLAY=":1"
directory=/home/moon
priority=50
autorestart=true
