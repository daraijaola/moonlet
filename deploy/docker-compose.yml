services:
  web:
    image: ${WEB_IMAGE:-moonlet-web:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/.data/moonlet.db
    volumes:
      - data:/app/.data
    ports: ["127.0.0.1:3000:3000"]

  # Vercel-style minute cron, without Vercel: hits /api/cron/tick with the secret.
  tick:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    depends_on: [web]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -m 55 -H "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron/tick >/dev/null || echo "tick failed $(date)"
          sleep 60
        done

  # Nightly SQLite snapshot to ~/backups on the host (online .backup, safe while web writes), keeping fourteen days.
  backup:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - data:/data
      - ${BACKUP_DIR:-${HOME}/backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          f=/backups/moonlet-$$(date -u +%Y%m%d-%H%M).db
          sqlite3 /data/moonlet.db ".backup '$$f'" && gzip -f "$$f" && echo "backup $$f.gz" || echo "backup failed $$(date)"
          find /backups -name 'moonlet-*.db.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  data:
