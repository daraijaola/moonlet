# Drop-in for the existing 16labs nginx server block: the site lives at / and is
# proxied to the Docker web container on 127.0.0.1:3000. Certbot adds the TLS block.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# Live desktop (Take control): the browser opens wss://<site>/vnc/<thread id>?ticket=…, a one-minute pass minted by
# /api/threads/<id>/vnc. nginx forwards it to the computers host, which checks the pass. Put this above `location /`.
# /etc/nginx/mc-ca.pem is MC_CA_B64 decoded.
location ~ ^/vnc/(th-[a-f0-9]+)$ {
    proxy_pass https://COMPUTERS_HOST:8443/v1/sandboxes/$1/vnc$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_ssl_trusted_certificate /etc/nginx/mc-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_name moonlet-computers;
    proxy_read_timeout 3600s;
    access_log off;
}
